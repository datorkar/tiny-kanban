<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Kanban</title>
<style>
:root{--sys:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f4f4f5;--col:#e9e9ec;--card:#fff;--fg:#1c1c1f;--mute:#77777f;--acc:#4f6ef7;--sh:0 1px 2px #0002;color-scheme:light dark}
/* Theme: follows the system unless set to light or dark in settings */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#18181b;--col:#232327;--card:#2e2e33;--fg:#ececf1;--mute:#8d8d96;--sh:0 1px 2px #0006;color-scheme:dark}}
:root[data-theme=dark]{--bg:#18181b;--col:#232327;--card:#2e2e33;--fg:#ececf1;--mute:#8d8d96;--sh:0 1px 2px #0006;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:clip}
html{background:transparent}
/* Background on a layer, not on body: a body background is copied to the page
   canvas (CSS background propagation), which body's opacity doesn't fade. */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg)}
body{color:var(--fg);font:12.5px/1.35 var(--sys);overflow:hidden;display:flex;flex-direction:column}
#h{flex:none;position:relative;height:22px;display:flex;align-items:center;padding-left:10px;user-select:none;-webkit-user-select:none;cursor:default}
#h span{flex:1;font-size:10.5px;font-weight:600;color:var(--mute);pointer-events:none}
#h button{width:30px;height:22px;border:0;background:none;color:var(--mute);font:13px/1 system-ui,sans-serif;cursor:pointer}
#h button:hover{background:#8883;color:var(--fg)}
#h #cl:hover{background:#e5484d;color:#fff}
#h #up{width:auto;height:16px;margin-right:4px;padding:0 7px;border-radius:8px;background:var(--acc);color:#fff;font:600 10px/16px system-ui,sans-serif}
#h #up:hover{filter:brightness(1.1)}
#h #mm{position:absolute;left:50%;top:0;width:30px;margin-left:-15px}
#tp svg{width:11px;height:11px;display:block;margin:auto}
.ontop #tp{color:var(--acc)}
#lk svg{width:11px;height:11px;display:block;margin:auto}
#lk .on,.locked #lk .off{display:none}
.locked #lk .on{display:inline}
.locked #lk{color:var(--acc)}
.locked #h,.locked #b{pointer-events:none}
.locked #h #lk{pointer-events:auto}
.locked #h>:not(#lk):not(span){opacity:.35}
.locked #st{display:none}
#h #lk,#h #tp,#h #cg{width:26px}
#cg svg{width:12px;height:12px;display:block;margin:auto}
.st #cg{color:var(--fg);background:#8883}
/* Settings: always regular size (outside #b, so mini mode doesn't scale it) */
#st{position:fixed;top:24px;right:4px;z-index:10;width:244px;max-height:calc(100% - 28px);overflow-y:auto;padding:8px 10px 10px;background:var(--card);border-radius:7px;box-shadow:0 6px 20px #0005;font:12px/1.35 var(--sys);color:var(--fg);user-select:none;-webkit-user-select:none}
#st[hidden]{display:none}
#st h3{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:8px 0 4px}
#st h3:first-child{margin-top:0}
#st .op{display:flex;align-items:center;gap:8px}
#st input[type=range]{flex:1;margin:0;accent-color:var(--acc)}
#st .op b{width:32px;text-align:right;font-weight:600;font-size:11px}
#st .cr{display:flex;align-items:center;gap:2px;margin-bottom:3px}
#st .cr input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid #8884;border-radius:4px;padding:3px 6px;outline:none}
#st .cr input:focus{border-color:var(--acc)}
#st button{border:0;background:none;color:var(--mute);font:inherit;border-radius:4px;cursor:pointer;height:24px}
#st button:hover:not(:disabled){background:#8883;color:var(--fg)}
#st button:disabled{opacity:.3;cursor:default}
#st .tr,#st .rm{width:24px;padding:0}
#st .tr svg{width:13px;height:13px;display:block;margin:auto}
#st .tr.on{color:var(--acc)}
#st .add-col{padding:0 6px;margin-top:2px}
#st .note{font-size:10.5px;color:var(--mute);margin-top:4px}
#st .err{color:#e5484d}
#st .seg{display:flex;background:var(--bg);border-radius:5px;padding:2px}
#st .seg button{flex:1;height:22px}
#st .seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--sh)}
#st .hd{width:14px;flex:none;color:var(--mute);cursor:grab;text-align:center;font-size:11px;touch-action:none}
#st .cr.mv{opacity:.6}
#st .kr{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
#st .key{min-width:96px;padding:0 8px;background:var(--bg);border:1px solid #8884!important;font-size:11px}
#st .key.rec{border-color:var(--acc)!important;color:var(--acc)}
#st .chk{display:flex;align-items:center;gap:6px;cursor:pointer}
#st .chk input{margin:0;accent-color:var(--acc)}
#arl{max-height:150px;overflow-y:auto}
#st .ar{display:flex;align-items:center;gap:2px;padding:2px 0;border-bottom:1px solid #8882}
#st .ar .at{flex:1;min-width:0}
#st .ar .tx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st .ar small{display:block;font-size:10px;color:var(--mute)}
#st .ar button{width:22px;padding:0;flex:none}
.web .os-only{display:none}
/* Time tracking clock: ticks once a second while the card is in a tracking column */
.ck{position:absolute;top:.42em;right:1.5em;width:.95em;height:.95em;color:var(--mute);display:none}
.timed{padding-right:2.6em}
.timed .ck{display:block}
.run .ck{color:var(--acc)}
.ck svg{width:100%;height:100%;display:block;overflow:visible}
.ck .hd{transform-box:view-box;transform-origin:50% 50%}

#mm::after{content:"";display:block;margin:auto;width:8px;height:8px;border-radius:50%;background:currentColor;transition:width .15s,height .15s}
.mini #mm::after{width:4px;height:4px}
#g{position:fixed;z-index:8;pointer-events:none;color:var(--mute);white-space:pre}
.col h2 span:first-child{overflow:hidden;text-overflow:ellipsis}
#b{--f:12.5px;font-size:var(--f);flex:1;min-height:0;display:flex;gap:6px;padding:0 6px 6px}
.mini #b{--f:7.25px}
/* Fonts tuned for tiny sizes in mini mode (macOS's system font already adapts) */
.os-win .mini #b{font-family:Tahoma,var(--sys)}
.os-linux .mini #b{font-family:"DejaVu Sans",var(--sys)}
.col{position:relative;flex:1;min-width:0;min-height:0;overflow:clip;display:flex;flex-direction:column;background:var(--col);border-radius:7px}
.col h2{white-space:nowrap;gap:.4em;font-size:.8em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:.7em .8em .3em;display:flex;justify-content:space-between;user-select:none;-webkit-user-select:none}
/* Native scrollbars take width from the cards, so they're hidden and a 3px
   overlay thumb (.sb) is drawn on top of the cards' right edge instead. */
.list{scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.sb{position:absolute;right:0;top:0;width:7px;padding:0 1px 0 3px;background:#8889;background-clip:content-box;border-radius:3px;opacity:0;transition:opacity .2s;cursor:default}
.col:hover .sb,.sb.on{opacity:1}
.sb[hidden]{display:none}
.list{flex:1;min-height:0;overflow-y:auto;padding:.24em .4em;display:flex;flex-direction:column;gap:.32em}
.card{position:relative;background:var(--card);border-radius:.4em;padding:.4em 1.6em .4em .56em;box-shadow:var(--sh);transition:font-size .15s ease-out;cursor:grab;user-select:none;-webkit-user-select:none;overflow-wrap:anywhere;touch-action:none}
.card .t{outline:none;display:block;min-height:1.35em}
.card .t[contenteditable=plaintext-only],.card .t[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.card:has([contenteditable=plaintext-only]),.card:has([contenteditable=true]){box-shadow:0 0 0 1.5px var(--acc)}
.x{position:absolute;top:.24em;right:.24em;border:0;background:none;color:var(--mute);font-size:1.04em;line-height:1;width:1.23em;height:1.23em;border-radius:3px;padding:0;cursor:pointer;opacity:0}
.card:hover .x{opacity:1}
.x:hover{background:#8883;color:var(--fg)}
.drag{position:fixed;left:0;top:0;z-index:9;pointer-events:none;cursor:grabbing;box-shadow:0 6px 18px #0004;will-change:transform}
.ph{border-radius:.4em;background:#8882;outline:1.5px dashed #8886;outline-offset:-1.5px;flex:none}
.add{margin:.24em .4em .4em;padding:.4em .56em;border:0;border-radius:.4em;transition:font-size .15s ease-out;background:transparent;color:var(--fg);font:inherit;outline:none}
.add::placeholder{color:var(--mute)}
.add:hover,.add:focus{background:var(--card)}
body.dragging,body.dragging *{cursor:grabbing!important}
/* Narrow windows: the update button becomes a dot; below 300px the title goes,
   the mini-mode dot moves left and the buttons slim down so nothing overlaps. */
@media (max-width:460px){#h #up{width:8px;height:8px;margin:0 6px;padding:0;border-radius:50%;font-size:0}}
@media (max-width:300px){
#h{padding-left:0}
#h span{display:none}
#h #mm{position:static;margin:0 auto 0 0;width:22px}
#h button,#h #lk,#h #tp,#h #cg{width:20px}
#h #mm{width:20px}
#b{gap:3px;padding:0 3px 3px}
}
/* Mini mode: dragged and edited cards and the focused input grow to full size;
   a hovered card pops out as a floating copy (#z) that doesn't move anything */
#z{position:fixed;z-index:7;cursor:grab;box-shadow:0 6px 20px #0004;transition:transform .15s ease-out}
#z[hidden]{display:none}
.mini .card.drag,.mini .card:has([contenteditable=plaintext-only]),.mini .card:has([contenteditable=true]),.mini .add:focus{font-size:12.5px;font-family:var(--sys)}
</style>
</head>
<body>
<header id="h" data-tauri-drag-region><span>Tiny Kanban</span><button id="mm" title="Mini mode"></button><button id="up" hidden></button><button id="cg" title="Settings"><svg viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M6.9 1h2.2l.4 1.9 1.2.5 1.6-1.1 1.6 1.6-1.1 1.6.5 1.2 1.9.4v2.2l-1.9.4-.5 1.2 1.1 1.6-1.6 1.6-1.6-1.1-1.2.5-.4 1.9H6.9l-.4-1.9-1.2-.5-1.6 1.1-1.6-1.6 1.1-1.6-.5-1.2L1 9.1V6.9l1.9-.4.5-1.2-1.1-1.6 1.6-1.6 1.6 1.1 1.2-.5zM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"/></svg></button><button id="tp" title="Always on top"><svg viewBox="0 0 16 16"><path d="M5.5 1.5h5l-.8 4.2 2.8 2.8v1.2h-9V8.5l2.8-2.8z" fill="currentColor"/><path d="M8 9.7V15" stroke="currentColor" stroke-width="1.6"/></svg></button><button id="lk" title="Lock"><svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="currentColor"/><path class="on" d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="currentColor" stroke-width="1.7"/><path class="off" d="M5.2 7V5a2.8 2.8 0 0 1 5.5-.8" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button><button id="mn" title="Minimise">&#8211;</button><button id="cl" title="Close">&#215;</button></header>
<div id="b"></div>
<span id="g" hidden></span>
<div id="z" class="card" hidden><span class="t"></span><button class="x" title="Archive">×</button><span class="ck"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="hd" d="M8 8V3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg></span></div>
<div id="st" hidden>
<h3>Opacity</h3>
<div class="op"><input id="opIn" type="range" min="10" max="100" step="10" value="100" aria-label="Opacity"><b id="opOut">100%</b></div>
<h3>Columns</h3>
<div id="stc"></div>
<button class="add-col" id="stAdd">+ Add column</button>
<div class="note">Drag ⠿ to reorder. The clock marks columns that track time on their cards.</div>
<h3>Theme</h3>
<div class="seg" id="th"><button data-v="">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
<div class="os-only">
<h3>Shortcuts</h3>
<div class="kr"><span>Lock / unlock</span><button class="key" id="kLock"></button></div>
<div class="kr"><span>Move to mouse</span><button class="key" id="kMove"></button></div>
<div class="note">Click a shortcut, then press the new keys. Backspace turns it off.</div>
<div class="note err" id="kErr" hidden></div>
<h3>Startup</h3>
<label class="chk"><input type="checkbox" id="auto"> Launch at login</label>
</div>
<h3>Archive <span id="arN"></span></h3>
<div id="arl"></div>
<div class="note" id="arNone">× on a card archives it here.</div>
<button class="add-col" id="arAll" hidden>Delete all permanently</button>
</div>
<script>
const DEFAULT_COLS = [{ name: 'To do' }, { name: 'Doing', track: true }, { name: 'Done' }];
document.documentElement.classList.add(/Windows/.test(navigator.userAgent) ? 'os-win' : /Mac/.test(navigator.userAgent) ? 'os-mac' : 'os-linux');
const B = document.getElementById('b');
const invoke = window.__TAURI__ && window.__TAURI__.core.invoke;
let lists = [], counts = [], timer;

const win = window.__TAURI__ && window.__TAURI__.window.getCurrentWindow();
document.getElementById('mn').onclick = () => win && win.minimize();
document.getElementById('cl').onclick = async () => {
  if (timer) { clearTimeout(timer); await save(); }
  win ? win.close() : window.close();
};

if (win) win.onCloseRequested(async () => { clearTimeout(timer); await save(); });

function persist(json) {
  if (invoke) return invoke('save', { data: json });
  else try { localStorage.setItem('kanban', json) } catch (_) {}
}

// The DOM is the model: read it back, update counts, save (debounced).
// Cards save as { t: text, ms: time tracked so far, since: when the current
// tracking stretch started }.
function save() {
  timer = 0;
  const cols = [...B.children].map(col => ({
    name: col.querySelector('h2 span').textContent,
    track: col.dataset.track === '1',
    cards: [...col.querySelectorAll('.list > .card')].map(c => {
      const o = { t: c.firstChild.textContent };
      if (+c.dataset.ms) o.ms = +c.dataset.ms;
      if (+c.dataset.since) o.since = +c.dataset.since;
      return o;
    })
  }));
  const bc = document.body.classList;
  beat = Date.now();
  return persist(JSON.stringify({ at: beat, mini: bc.contains('mini'), locked: bc.contains('locked'), ontop: bc.contains('ontop'), opacity, theme, keys, cols, archive }));
}
function sync() {
  lists = [...B.querySelectorAll('.list')];
  counts = [...B.querySelectorAll('.col h2 span+span')];
  track();
  lists.forEach(thumb);
  indexWords();
  lists.forEach((l, i) => counts[i].textContent = l.children.length || '');
  clearTimeout(timer);
  timer = setTimeout(save, 120);
}

function card(v) {
  const o = typeof v === 'string' ? { t: v } : v, c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<span class="t"></span><button class="x" title="Archive">×</button><span class="ck"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="hd" d="M8 8V3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg></span>';
  c.firstChild.textContent = o.t;
  if (o.ms) c.dataset.ms = o.ms;
  if (o.since) c.dataset.since = o.since;
  return c;
}

// Time tracking: a card's clock runs while it sits in a column that tracks
// time; leaving the column banks the elapsed time. Called on every change.
function track() {
  const now = Date.now();
  for (const col of B.children) {
    const on = col.dataset.track === '1';
    for (const c of col.querySelectorAll('.list > .card')) {
      const since = +c.dataset.since || 0;
      if (on && !since) c.dataset.since = now;
      if (!on && since) { c.dataset.ms = (+c.dataset.ms || 0) + now - since; delete c.dataset.since; }
      c.classList.toggle('run', on);
      c.classList.toggle('timed', on || +c.dataset.ms > 0);
    }
  }
}
// Clocks only count while the app runs. Each save stamps the time ("at"), and
// running clocks save once a minute, so after a restart running cards are
// credited up to the last stamp. A long gap between beats means the computer
// slept, and that gap isn't counted either.
let beat = Date.now();
function pause(from, to) {
  for (const c of B.querySelectorAll('.card[data-since]')) {
    const since = +c.dataset.since;
    if (since < from) c.dataset.ms = (+c.dataset.ms || 0) + from - since;
    c.dataset.since = Math.max(since, to);
  }
}
setInterval(() => {
  const now = Date.now();
  if (now - beat > 150e3) pause(beat + 60e3, now); // asleep: count up to the expected beat only
  if (B.querySelector('.card.run')) { clearTimeout(timer); save(); }
}, 60e3);
// Clock hands step once a second from a timer: the page changes only then, and
// not at all when no clock runs or the window is hidden.
let tickN = 0;
setInterval(() => {
  if (document.hidden) return;
  const hands = B.querySelectorAll('.run .ck .hd');
  if (!hands.length) return;
  tickN = (tickN + 1) % 8;
  for (const h of hands) h.style.transform = `rotate(${tickN * 45}deg)`;
}, 1000);
function elapsed(c) { return (+c.dataset.ms || 0) + (+c.dataset.since ? Date.now() - c.dataset.since : 0) }
function fmt(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : m ? `${m}m` : `${Math.floor(ms / 1000)}s`;
}
// Hovering a clock shows the time spent; works on the mini-mode pop-out too.
addEventListener('pointerover', e => {
  const ck = e.target.closest('.ck');
  if (!ck) return;
  const c = ck.closest('.card'), src = c === Z ? zc : c;
  if (src) ck.title = `Time tracked: ${fmt(elapsed(src))}` + (src.classList.contains('run') ? ' (running)' : '');
});

function addColumn(o, before = null) {
  const col = document.createElement('section');
  col.className = 'col';
  col.dataset.track = o.track ? '1' : '';
  col.innerHTML = '<h2><span></span><span></span></h2><div class="list"></div><div class="sb" hidden></div><input class="add" placeholder="+" title="Add a card" aria-label="Add a card" spellcheck="true" autocomplete="off">';
  col.querySelector('span').textContent = o.name;
  const list = col.querySelector('.list');
  list.addEventListener('scroll', () => thumb(list));
  if (o.cards) list.append(...o.cards.map(card));
  col.querySelector('.add').addEventListener('keydown', e => {
    const v = e.target.value.trim();
    if (e.key === 'Enter' && v) {
      list.append(card(v));
      e.target.value = '';
      list.scrollTop = list.scrollHeight;
      sync();
    } else if (e.key === 'Escape') e.target.blur();
  });
  B.insertBefore(col, before);
  return col;
}

function build(data) {
  const cols = data && Array.isArray(data.cols) && data.cols.length ? data.cols : DEFAULT_COLS;
  // Boards saved before columns were configurable: Doing tracks time.
  for (const c of cols) addColumn({ ...c, track: c.track ?? /^doing$/i.test(c.name) });
  pause(data && data.at || Date.now(), Date.now()); // the app was closed in between
  sync();
}

// Delete
B.addEventListener('click', e => {
  if (e.target.classList.contains('x')) archiveCard(e.target.parentNode);
});

// Edit on double-click: Enter saves, Esc cancels, empty deletes.
B.addEventListener('dblclick', e => edit(e.target.closest('.t')));
function edit(t) {
  if (!t || t.isContentEditable) return;
  const old = t.textContent;
  t.spellcheck = true;
  try { t.contentEditable = 'plaintext-only' } catch (_) { t.contentEditable = 'true' }
  t.focus();
  getSelection().selectAllChildren(t);
  const done = () => {
    t.removeEventListener('keydown', key);
    t.contentEditable = 'false';
    t.textContent = t.textContent.replace(/\s+/g, ' ').trim();
    if (!t.textContent) { t.textContent = old; return archiveCard(t.parentNode); } // cleared = archive
    sync();
  };
  const key = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); t.blur(); }
    else if (ev.key === 'Escape') { t.textContent = old; t.blur(); }
  };
  t.addEventListener('keydown', key);
  t.addEventListener('blur', done, { once: true });
}

// Drag & drop with pointer events (consistent across WebKit / WebView2 / WebKitGTK).
let d = null;
B.addEventListener('pointerdown', e => {
  const c = e.target.closest('.card');
  if (!c || e.button !== 0 || e.target.closest('.x') || c.querySelector('[contenteditable=true],[contenteditable=plaintext-only]')) return;
  d = { c, sx: e.clientX, sy: e.clientY, on: false };
});

addEventListener('pointermove', e => {
  if (!d) return;
  if (!d.on) {
    if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) < 5) return;
    const cr = d.c.getBoundingClientRect(), r = d.from || cr; // from = the mini-mode pop-out
    d.ox = d.sx - r.left; d.oy = d.sy - r.top;
    d.ph = document.createElement('div');
    d.ph.className = 'ph';
    d.ph.style.height = cr.height + 'px';
    d.c.replaceWith(d.ph);
    d.c.style.width = r.width + 'px';
    d.c.classList.add('drag');
    document.body.append(d.c);
    document.body.classList.add('dragging');
    d.on = true;
  }
  const x = e.clientX, y = e.clientY;
  d.c.style.transform = `translate(${x - d.ox}px,${y - d.oy}px) rotate(1.5deg)`;
  if (d.raf) return;
  d.raf = requestAnimationFrame(() => {
    d.raf = 0;
    const col = document.elementFromPoint(x, y)?.closest('.col');
    if (!col) return;
    const list = col.querySelector('.list');
    let before = null;
    for (const el of list.children) {
      if (el === d.ph) continue;
      const r = el.getBoundingClientRect();
      if (y < r.top + r.height / 2) { before = el; break; }
    }
    if (d.ph.parentNode !== list || d.ph.nextSibling !== before) list.insertBefore(d.ph, before);
  });
});

function end() {
  if (!d) return;
  if (d.on) {
    cancelAnimationFrame(d.raf);
    d.c.classList.remove('drag');
    d.c.style.transform = d.c.style.width = '';
    d.ph.replaceWith(d.c);
    document.body.classList.remove('dragging');
    sync();
  }
  d = null;
}
addEventListener('pointerup', end);

// Mini-mode pop-out: a full-size floating copy of the hovered card, grown from
// the card's centre. It overlaps neighbours and column edges instead of pushing
// cards around, and acts for the card: drag it, double-click to edit, × deletes.
const Z = document.getElementById('z');
let zc = null;
function hideZoom() { Z.hidden = true; zc = null }
B.addEventListener('pointerover', e => {
  const c = e.target.closest('.card');
  if (!c || c === zc || d || e.pointerType === 'touch' || !document.body.classList.contains('mini') ||
      document.body.classList.contains('locked') || c.querySelector('[contenteditable=true],[contenteditable=plaintext-only]')) return;
  zc = c;
  const r = c.getBoundingClientRect(), k = 12.5 / parseFloat(getComputedStyle(c).fontSize); // mini -> full size
  Z.firstChild.textContent = c.firstChild.textContent;
  Z.className = c.className;
  const w = Math.min(r.width * k, innerWidth - 8);
  Z.style.cssText = `width:${w}px;transition:none;transform:none`;
  Z.hidden = false;
  const h = Z.offsetHeight, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const left = Math.max(4, Math.min(cx - w / 2, innerWidth - w - 4));
  const top = Math.max(4, Math.min(cy - h / 2, innerHeight - h - 4));
  Z.style.left = left + 'px'; Z.style.top = top + 'px';
  Z.style.transformOrigin = `${cx - left}px ${cy - top}px`;
  Z.style.transform = `scale(${r.width / w})`;
  Z.offsetWidth; // start from the card's own size…
  Z.style.transition = ''; Z.style.transform = ''; // …and grow
});
Z.addEventListener('pointerleave', hideZoom);
Z.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !zc) return;
  if (e.target.closest('.x')) { const c = zc; hideZoom(); archiveCard(c); return; }
  d = { c: zc, sx: e.clientX, sy: e.clientY, on: false, from: Z.getBoundingClientRect() };
});
addEventListener('pointermove', () => { if (d && d.on && !Z.hidden) hideZoom() });
Z.addEventListener('dblclick', () => { const c = zc; hideZoom(); edit(c && c.querySelector('.t')) });
Z.addEventListener('wheel', e => { const l = zc && zc.parentNode; hideZoom(); if (l) l.scrollBy(0, e.deltaY) }, { passive: true });
addEventListener('pointercancel', end);
addEventListener('blur', end);

// Autocomplete: offer words already on the board as faint ghost text after
// the caret. Tab or → accepts. Only at the end of the text being typed.
const G = document.getElementById('g'), WORD = /[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu;
let words = [], sugg = '', measure;
function indexWords() {
  const n = new Map();
  for (const t of B.querySelectorAll('.t'))
    for (const w of t.textContent.match(WORD) || [])
      if (w.length > 2) { const k = w.toLowerCase(), e = n.get(k); e ? e.c++ : n.set(k, { w, c: 1 }) }
  words = [...n.values()].sort((a, b) => b.c - a.c).map(e => e.w);
}
function hideGhost() { sugg = ''; G.hidden = true }
function suggest(el) {
  hideGhost();
  const input = el.tagName === 'INPUT', cs = getComputedStyle(el);
  let text, caret, x, top, h;
  if (input) {
    if (el.selectionStart !== el.selectionEnd) return;
    text = el.value; caret = el.selectionStart;
  } else {
    const sel = getSelection();
    if (!sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0), pre = r.cloneRange();
    pre.selectNodeContents(el); pre.setEnd(r.endContainer, r.endOffset);
    text = el.textContent; caret = pre.toString().length;
    let rc = r.getClientRects()[0], right = false;
    if (!rc && el.firstChild && el.firstChild.length) {
      // WebKit can return no rect for a collapsed caret; measure the last char instead.
      const lc = document.createRange(), n = el.firstChild;
      lc.setStart(n, n.length - 1); lc.setEnd(n, n.length);
      rc = lc.getBoundingClientRect(); right = true;
    }
    if (!rc) return;
    x = right ? rc.right : rc.left; top = rc.top; h = rc.height;
  }
  if (caret !== text.length) return;
  const m = text.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*$/u);
  if (!m || m[0].length < 2) return;
  const p = m[0].toLowerCase(), w = words.find(w => w.length > p.length && w.toLowerCase().startsWith(p));
  if (!w) return;
  if (input) {
    const r = el.getBoundingClientRect();
    measure = measure || document.createElement('canvas').getContext('2d');
    measure.font = cs.font;
    x = r.left + parseFloat(cs.paddingLeft) + measure.measureText(text).width - el.scrollLeft;
    top = r.top + parseFloat(cs.paddingTop); h = parseFloat(cs.lineHeight);
    if (x > r.right - parseFloat(cs.paddingRight)) return;
  }
  sugg = w.slice(p.length);
  G.textContent = sugg;
  G.style.font = cs.font;
  G.style.cssText += `;left:${x}px;top:${top}px;line-height:${h}px`;
  G.hidden = false;
}
B.addEventListener('input', e => suggest(e.target));
B.addEventListener('keydown', e => {
  if (sugg && (e.key === 'Tab' || e.key === 'ArrowRight')) {
    e.preventDefault();
    document.execCommand('insertText', false, sugg);
  }
  hideGhost();
}, true);
B.addEventListener('focusout', hideGhost);
B.addEventListener('scroll', hideGhost, true);

// Auto-update: check on start and every 6 hours; the header shows a button
// when a new version is ready.
// Mini mode: half-size text; cards grow back to full size on hover.
document.getElementById('mm').onclick = () => { document.body.classList.toggle('mini'); hideZoom(); sync(); };

// Lock: everything except the lock button ignores mouse and keyboard.
const lk = document.getElementById('lk');
// Locked windows also let clicks through to whatever is behind them, except on
// the lock button itself (where the OS supports it; see passthrough in main.rs).
function setLocked(on) {
  document.body.classList.toggle('locked', on);
  lk.title = on ? 'Unlock' : 'Lock';
  if (on) { end(); hideSettings(); hideZoom(); if (document.activeElement !== lk) document.activeElement.blur(); }
  syncPassthrough();
}
async function syncPassthrough() {
  if (!invoke) return;
  const on = document.body.classList.contains('locked'), r = lk.getBoundingClientRect();
  const through = await invoke('passthrough', { keep: on ? [r.x, r.y, r.width, r.height] : null });
  if (on && through) lk.title = 'Unlock (clicks pass through to the windows behind)';
}
addEventListener('resize', () => { if (document.body.classList.contains('locked')) syncPassthrough() });

// Overlay scrollbar thumbs: 3px, drawn over the cards so they don't narrow them.
function thumb(l) {
  const sb = l.nextSibling, { scrollTop: t, scrollHeight: sh, clientHeight: ch } = l;
  if (sh <= ch + 1) { sb.hidden = true; return; }
  const h = Math.max(16, ch * ch / sh);
  sb.hidden = false;
  sb.style.height = h + 'px';
  sb.style.transform = `translateY(${l.offsetTop + t / (sh - ch) * (ch - h)}px)`;
}
addEventListener('resize', () => lists.forEach(thumb));
B.addEventListener('transitionend', () => lists.forEach(thumb)); // mini-mode size change
B.addEventListener('input', e => { const l = e.target.closest('.list'); if (l) thumb(l) }); // editing grows a card
B.addEventListener('pointerdown', e => {
  const sb = e.target.closest('.sb');
  if (!sb || e.button !== 0) return;
  e.preventDefault();
  const l = sb.previousSibling, y0 = e.clientY, t0 = l.scrollTop;
  const k = (l.scrollHeight - l.clientHeight) / (l.clientHeight - sb.offsetHeight);
  sb.classList.add('on'); sb.setPointerCapture(e.pointerId);
  const move = ev => { l.scrollTop = t0 + (ev.clientY - y0) * k };
  sb.addEventListener('pointermove', move);
  sb.addEventListener('lostpointercapture', () => { sb.removeEventListener('pointermove', move); sb.classList.remove('on') }, { once: true });
});

// Always on top
const tp = document.getElementById('tp');
function setOnTop(on) {
  document.body.classList.toggle('ontop', on);
  tp.title = on ? 'Always on top (on)' : 'Always on top';
  if (invoke) invoke('set_on_top', { on });
}
tp.onclick = () => { setOnTop(!document.body.classList.contains('ontop')); sync(); };
lk.onclick = () => { setLocked(!document.body.classList.contains('locked')); sync(); };
addEventListener('keydown', e => {
  if (document.body.classList.contains('locked') && e.target !== lk) { e.preventDefault(); e.stopPropagation(); }
}, true);

// Settings (cogwheel): opacity and columns. Right-click is left to the system.
const st = document.getElementById('st'), stc = document.getElementById('stc'), cg = document.getElementById('cg');
const opIn = document.getElementById('opIn'), opOut = document.getElementById('opOut');
let opacity = 100;
function setOpacity(v) {
  opacity = Math.min(100, Math.max(10, Math.round(v / 10) * 10 || 100));
  document.body.style.opacity = opacity === 100 ? '' : opacity / 100;
  opIn.value = opacity; opOut.textContent = opacity + '%';
}
opIn.oninput = () => { setOpacity(+opIn.value); sync(); };
function hideSettings() {
  st.hidden = true; document.body.classList.remove('st');
  if (recording) { recording = null; paintKeys(); applyKeys(); } // don't leave shortcuts switched off
}
cg.onclick = () => {
  if (!st.hidden) return hideSettings();
  renderSettings(); st.hidden = false; document.body.classList.add('st');
};
function renderSettings() {
  stc.replaceChildren();
  const cols = [...B.children];
  cols.forEach(col => {
    const r = document.createElement('div');
    r.className = 'cr';
    r.innerHTML = '<span class="hd" title="Drag to reorder">⠿</span><input aria-label="Column name" spellcheck="false"><button class="tr">TRK</button><button class="rm" title="Remove column (its cards move to the neighbouring column)">×</button>'
      .replace('TRK', CLOCK);
    r.col = col;
    const name = r.children[1], tr = r.children[2], rm = r.children[3];
    name.value = col.querySelector('h2 span').textContent;
    name.oninput = () => { col.querySelector('h2 span').textContent = name.value.trim() || 'Untitled'; sync(); };
    const paint = () => { const on = col.dataset.track === '1'; tr.classList.toggle('on', on); tr.title = on ? 'Tracks time on cards (click to stop)' : 'Track time on cards in this column'; };
    paint();
    tr.onclick = () => { col.dataset.track = col.dataset.track === '1' ? '' : '1'; paint(); sync(); };
    rm.disabled = cols.length < 2;
    rm.onclick = () => {
      const to = (col.previousElementSibling || col.nextElementSibling).querySelector('.list');
      to.append(...col.querySelectorAll('.list > .card'));
      col.remove(); sync(); renderSettings();
    };
    stc.append(r);
  });
  paintTheme(); paintKeys(); renderArchive();
  if (invoke) invoke('autostart', {}).then(v => { auto.checked = v }, () => { auto.disabled = true });
}

// Column order: drag a row's ⠿ handle; the board's columns follow on drop.
stc.addEventListener('pointerdown', e => {
  const hd = e.target.closest('.hd');
  if (!hd || e.button !== 0) return;
  e.preventDefault();
  const row = hd.parentNode;
  row.classList.add('mv');
  const move = ev => {
    const other = [...stc.children].find(r => r !== row && (() => { const b = r.getBoundingClientRect(); return ev.clientY > b.top && ev.clientY < b.bottom })());
    if (!other) return;
    const b = other.getBoundingClientRect();
    stc.insertBefore(row, ev.clientY < b.top + b.height / 2 ? other : other.nextSibling);
  };
  // Window-level listeners rather than pointer capture: moving the row in the
  // DOM would drop the capture.
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    row.classList.remove('mv');
    B.append(...[...stc.children].map(r => r.col)); sync();
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});

// Theme
let theme = '';
function setTheme(v) {
  theme = v || '';
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
}
function paintTheme() { for (const b of document.querySelectorAll('#th button')) b.classList.toggle('on', b.dataset.v === theme) }
document.getElementById('th').onclick = e => { const b = e.target.closest('button'); if (b) { setTheme(b.dataset.v); paintTheme(); sync(); } };

// Global shortcuts: lock/unlock and move-window-to-mouse, recorded by pressing keys.
const MAC = /Mac/.test(navigator.userAgent);
let keys = { lock: 'CmdOrCtrl+Alt+KeyL', mv: 'CmdOrCtrl+Alt+KeyM' }, recording = null;
const kBtn = { lock: document.getElementById('kLock'), mv: document.getElementById('kMove') }, kErr = document.getElementById('kErr');
function pretty(k) {
  if (!k) return 'Off';
  const names = { CmdOrCtrl: MAC ? '⌘' : 'Ctrl', Ctrl: MAC ? '⌃' : 'Ctrl', Alt: MAC ? '⌥' : 'Alt', Shift: MAC ? '⇧' : 'Shift', Super: MAC ? '⌘' : 'Win',
    ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→' };
  return k.split('+').map(p => names[p] || p.replace(/^Key|^Digit/, '')).join(MAC ? '' : '+');
}
function paintKeys() { for (const w in kBtn) { kBtn[w].textContent = recording === w ? 'Press keys…' : pretty(keys[w]); kBtn[w].classList.toggle('rec', recording === w) } }
async function applyKeys() {
  if (!invoke) return;
  try { await invoke('set_shortcuts', { lock: keys.lock, mv: keys.mv }); kErr.hidden = true }
  catch (e) { kErr.textContent = "Couldn't register (taken by another app?): " + e; kErr.hidden = false }
}
for (const w in kBtn) kBtn[w].onclick = () => {
  recording = recording === w ? null : w; paintKeys();
  if (recording && invoke) invoke('set_shortcuts', { lock: '', mv: '' }); // so the old keys reach the page
  else applyKeys();
};
addEventListener('keydown', e => {
  if (!recording) return;
  e.preventDefault(); e.stopPropagation();
  if (['Control', 'Alt', 'Shift', 'Meta', 'AltGraph'].includes(e.key)) return; // wait for the actual key
  if (e.key === 'Backspace' || e.key === 'Delete') keys[recording] = '';
  else if (e.key !== 'Escape') {
    if (!e.ctrlKey && !e.altKey && !e.metaKey) return; // needs Ctrl, Alt or ⌘/Win
    keys[recording] = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Super', e.code].filter(Boolean).join('+');
  }
  recording = null; paintKeys(); applyKeys(); sync();
}, true);
if (window.__TAURI__) window.__TAURI__.event.listen('shortcut', () => { setLocked(!document.body.classList.contains('locked')); sync() });
else document.documentElement.classList.add('web');

// Launch at login
const auto = document.getElementById('auto');
auto.onchange = () => invoke('autostart', { on: auto.checked }).then(v => { auto.checked = v }, () => { auto.checked = !auto.checked });

// Archive: × archives a card (keeping its tracked time); settings lists them
// to restore or delete permanently.
let archive = [];
function archiveCard(c) {
  const since = +c.dataset.since || 0, ms = (+c.dataset.ms || 0) + (since ? Date.now() - since : 0);
  const o = { t: c.firstChild.textContent, col: c.closest('.col') ? c.closest('.col').querySelector('h2 span').textContent : '', at: Date.now() };
  if (ms) o.ms = ms;
  archive.unshift(o);
  c.remove(); sync();
  if (!st.hidden) renderArchive();
}
const arl = document.getElementById('arl'), arAll = document.getElementById('arAll');
function renderArchive() {
  arl.replaceChildren();
  document.getElementById('arN').textContent = archive.length ? `(${archive.length})` : '';
  document.getElementById('arNone').hidden = archive.length > 0;
  arAll.hidden = !archive.length; arAll.textContent = 'Delete all permanently'; arAll.dataset.sure = '';
  archive.forEach((o, i) => {
    const r = document.createElement('div');
    r.className = 'ar';
    r.innerHTML = '<div class="at"><span class="tx"></span><small></small></div><button title="Restore to its column">↺</button><button title="Delete permanently">×</button>';
    r.querySelector('.tx').textContent = r.querySelector('.tx').title = o.t;
    r.querySelector('small').textContent = [o.col, new Date(o.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }), o.ms && fmt(o.ms)].filter(Boolean).join(' · ');
    r.children[1].onclick = () => {
      const col = [...B.children].find(c => c.querySelector('h2 span').textContent === o.col) || B.firstElementChild;
      col.querySelector('.list').append(card(o));
      archive.splice(i, 1); sync(); renderArchive();
    };
    r.children[2].onclick = () => { archive.splice(i, 1); sync(); renderArchive(); };
    arl.append(r);
  });
}
arAll.onclick = () => {
  if (!arAll.dataset.sure) { arAll.dataset.sure = '1'; arAll.textContent = `Click again to delete ${archive.length} card${archive.length > 1 ? 's' : ''}`; return; }
  archive = []; sync(); renderArchive();
};
const CLOCK = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v4l2.6 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
document.getElementById('stAdd').onclick = () => {
  addColumn({ name: 'New column' }); sync(); renderSettings();
  const inputs = stc.querySelectorAll('input'); inputs[inputs.length - 1].select();
};
addEventListener('pointerdown', e => { if (!st.hidden && !st.contains(e.target) && !cg.contains(e.target)) hideSettings() }, true);
addEventListener('keydown', e => { if (e.key === 'Escape' && !st.hidden) hideSettings() });

const up = document.getElementById('up');
async function checkUpdate() {
  try {
    const v = await invoke('check_update');
    if (v) { up.textContent = 'Update to ' + v; up.hidden = false; }
  } catch (_) {}
}
up.onclick = async () => {
  up.disabled = true; up.textContent = 'Updating…';
  if (timer) { clearTimeout(timer); await save(); }
  try { await invoke('install_update') }
  catch (e) { up.textContent = 'Update failed'; up.title = String(e); up.disabled = false; }
};
if (invoke) { setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 6 * 3600e3); }

// Load
(async () => {
  let raw = '';
  try { raw = invoke ? await invoke('load') : localStorage.getItem('kanban') || '' } catch (_) {}
  let data = null;
  try { data = raw && JSON.parse(raw) } catch (_) {}
  if (data && data.mini) document.body.classList.add('mini');
  if (data && data.ontop) setOnTop(true);
  if (data && data.locked) setLocked(true);
  if (data && data.opacity) setOpacity(data.opacity);
  if (data && data.theme) setTheme(data.theme);
  if (data && data.keys) keys = { ...keys, ...data.keys };
  if (data && Array.isArray(data.archive)) archive = data.archive;
  applyKeys();
  build(data);
})();
</script>
