name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
            out: src-tauri/target/release/bundle
          - name: windows
            os: windows-latest
            args: ''
            out: src-tauri/target/release/bundle
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            out: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-kanban-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # GitHub turns spaces in asset names into dots; use clean names instead.
      - name: Normalise file names
        run: |
          find dist -type f -name '* *' | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed 's/Tiny Kanban/tiny-kanban/; s/ /-/g')"
          done
          find dist -type f

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
