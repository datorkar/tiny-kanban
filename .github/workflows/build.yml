name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (tag v<version from tauri.conf.json>)
        type: boolean
        default: false

# Least privilege: jobs can only read the repo; the release job asks for more.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ''
            out: src-tauri/target/release/bundle
          - name: windows
            os: windows-latest
            args: ''
            out: src-tauri/target/release/bundle
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            out: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # Signs update bundles when the key secret is set; otherwise builds unsigned
      # installers only (fine for CI, but releases need the key for auto-update).
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set; building without update signatures"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          # --locked: build exactly what Cargo.lock says (npm ci does the same for npm)
          npx tauri build ${{ matrix.args }} "${extra[@]}" -- --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiny-kanban-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/msi/*.msi
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/macos/*.app.tar.gz
            ${{ matrix.out }}/**/*.sig
          if-no-files-found: error

  release:
    # Only a v* tag, or "Run workflow" with release ticked on main, publishes.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write     # create the tag and release
      id-token: write     # sign the build provenance
      attestations: write # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Work out tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # GitHub turns spaces in asset names into dots; use clean names instead.
      - name: Normalise file names
        run: |
          find dist -type f -name '* *' | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed 's/Tiny Kanban/tiny-kanban/; s/ /-/g')"
          done
          find dist -type f

      - name: Updater manifest
        run: |
          python3 .github/scripts/latest_json.py dist "$GITHUB_REPOSITORY" "${{ steps.tag.outputs.name }}" > latest.json
          cat latest.json
          mkdir out
          find dist -type f ! -name '*.sig' -exec mv {} out/ \;
          mv latest.json out/

      # Software bill of materials: every Rust and npm dependency, from the lock files.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: out/tiny-kanban-${{ steps.tag.outputs.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # Signed statement that these files were built by this workflow from this
      # commit. Verify with: gh attestation verify <file> -R datorkar/tiny-kanban
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Tiny Kanban ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
