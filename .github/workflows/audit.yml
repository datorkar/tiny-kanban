name: Security audit

# Weekly check of all Rust dependencies against the RustSec advisory database.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities; "unmaintained" and similar warnings are only listed.
      - run: cargo audit
        working-directory: src-tauri
