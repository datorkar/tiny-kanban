[package]
name = "tiny-kanban"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
notify-rust = "4" # card timer notifications; reports failure, so the app can fall back
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Efficiency mode while unfocused (versions match what wry/tauri already use)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Optimise for a tiny binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
